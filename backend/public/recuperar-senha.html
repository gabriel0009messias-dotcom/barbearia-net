<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar senha | Salaoflix</title>
    <link rel="stylesheet" href="./styles.css?v=20260408c" />
  </head>
  <body>
    <section class="auth-landing">
      <div class="landing-overlay"></div>
      <header class="landing-topbar">
        <div class="landing-brand">SALAOFLIX</div>
        <div class="landing-topbar-actions">
          <a class="landing-topbar-button link-button" href="/">Voltar</a>
        </div>
      </header>

      <div class="landing-grid">
        <div class="landing-copy">
          <p class="landing-kicker">Recuperacao de senha</p>
          <h1>Receba um link seguro no seu Gmail</h1>
          <p class="landing-subcopy">
            Informe o Gmail cadastrado. Se ele existir no sistema, vamos enviar um link unico para voce redefinir sua senha.
          </p>
        </div>

        <div class="landing-panel">
          <p class="eyebrow">Esqueci minha senha</p>
          <h2>Recuperar acesso</h2>
          <p class="landing-panel-copy">O link de recuperacao expira automaticamente para proteger sua conta.</p>

          <form id="recuperacaoLinkForm" class="landing-login-form">
            <input id="recuperacaoEmailInput" type="email" placeholder="Seu Gmail cadastrado" required />
            <button type="submit" class="landing-login-button">Enviar link de recuperacao</button>
          </form>

          <p id="recuperacaoLinkMessage" class="form-message light-message"></p>
        </div>
      </div>
    </section>

    <script src="./recuperar-senha.js?v=20260408c"></script>
  </body>
</html>
