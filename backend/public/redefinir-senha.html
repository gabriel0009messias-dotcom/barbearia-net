<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir senha | Studiofy</title>
    <link rel="stylesheet" href="./styles.css?v=20260408c" />
  <link rel="stylesheet" href="/studiofy-auth.css?v=mobile-2"><link rel="stylesheet" href="/studiofy-password.css?v=mobile-2"></head>
  <body class="auth-page password-page">
    <section class="auth-landing">
      <div class="landing-overlay"></div>
      <header class="landing-topbar">
        <a class="auth-brand" href="/">Studio<span>fy</span></a>
        <div class="landing-topbar-actions">
          <a class="landing-topbar-button link-button" href="/login.html">Voltar ao login</a>
        </div>
      </header>

      <div class="landing-grid">
        <div class="landing-copy">
          <p class="landing-kicker">Redefinir senha</p>
          <h1>Crie sua nova senha Studiofy</h1>
          <p class="landing-subcopy">
            Este link é único, expira em 60 minutos e só permite redefinir a senha com um token válido.
          </p>
        </div>

        <div class="landing-panel">
          <p class="eyebrow">Nova senha</p>
          <h2>Atualize seu acesso</h2>
          <p id="resetPasswordInfo" class="landing-panel-copy">Validando link de recuperação...</p>

          <form id="resetPasswordForm" class="landing-login-form" hidden>
            <label for="novaSenhaInput">Nova senha</label><div class="password-field">
              <input autocomplete="new-password" id="novaSenhaInput" type="password" placeholder="Nova senha" minlength="4" required />
              <button class="password-toggle" type="button" data-toggle-password="novaSenhaInput">Mostrar</button>
            </div>
            <label for="confirmarSenhaInput">Confirmar nova senha</label><div class="password-field">
              <input autocomplete="new-password" id="confirmarSenhaInput" type="password" placeholder="Confirmar nova senha" minlength="4" required />
              <button class="password-toggle" type="button" data-toggle-password="confirmarSenhaInput">Mostrar</button>
            </div>
            <button type="submit" class="landing-login-button">Salvar nova senha</button>
          </form>

          <p id="resetPasswordMessage" class="form-message light-message"></p>
        </div>
      </div>
    </section>

    <script src="./redefinir-senha.js?v=20260408c"></script>
  </body>
</html>
