services:
  - type: web
    name: barbearia-net
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx puppeteer browsers install chrome --path ./.cache/puppeteer
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_PATH
        value: /var/data/barbearia.db
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/backend/.cache/puppeteer
    disk:
      name: barbearia-data
      mountPath: /var/data
      sizeGB: 1
