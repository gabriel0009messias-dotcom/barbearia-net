services:
  - type: web
    name: barbearia-net
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_PATH
        value: /var/data/barbearia.db
      - key: PUBLIC_APP_URL
        value: https://barbearia-net.onrender.com
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
    disk:
      name: barbearia-data
      mountPath: /var/data
      sizeGB: 1
