services:
  - type: web
    name: barbearia-net
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx puppeteer browsers install chrome --path ./puppeteer-cache
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_PATH
        value: /var/data/barbearia.db
      - key: PUBLIC_APP_URL
        value: https://barbearia-net.onrender.com
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/backend/puppeteer-cache
    disk:
      name: barbearia-data
      mountPath: /var/data
      sizeGB: 1
